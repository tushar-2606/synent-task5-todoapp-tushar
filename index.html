<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <title>Modern To Do List</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="hero-copy">
          <h1>My To Do List</h1>
          <p>Stay focused with a clean, modern task tracker built for today.</p>
        </div>
      </header>

      <main class="container">
        <div class="input-container">
          <input type="text" id="taskInput" placeholder="Add a new task..." aria-label="New task" />
          <button id="addTaskButton" type="button">Add Task</button>
        </div>

        <ul class="todolist" id="todoList"></ul>

        <div class="note">Tip: Click a task to mark it complete. Use the trash icon to remove it.</div>
      </main>
    </div>

    <script src="index.js"></script>
  </body>
</html>
